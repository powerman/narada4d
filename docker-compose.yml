services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: gotest
    ports:
      - "${NARADA4D_MYSQL_PORT:?}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
    ports:
      - "${NARADA4D_PG_PORT:?}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 10
